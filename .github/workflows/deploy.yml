name: Deploy
# Otomatis memasang cabang main ke server setelah CI lulus. Perlu tiga rahasia di
# Settings > Secrets and variables > Actions: DEPLOY_HOST (IP/alamat server), DEPLOY_USER (mis. ubuntu), DEPLOY_SSH_KEY (kunci privat).
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan kunci SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          # Kunci yang disalin dari Windows bisa berawalan BOM dan berakhiran CR; OpenSSH di Linux menolaknya.
          printf '%s\n' "$KEY" | tr -d '\r' | sed '1s/^\xEF\xBB\xBF//' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          # Diagnostik aman: hanya metadata (jumlah/panjang baris, sidik jari), bukan isi kunci.
          if ! ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>/tmp/keyerr; then
            echo "Kunci SSH tidak valid: $(cat /tmp/keyerr)"
            echo "Jumlah baris: $(wc -l < ~/.ssh/id_deploy), ukuran: $(wc -c < ~/.ssh/id_deploy) byte"
            awk '{ printf "baris %d: %d karakter\n", NR, length($0) }' ~/.ssh/id_deploy
            exit 1
          fi
          ssh-keygen -l -f ~/.ssh/id_deploy
      - name: Jalankan deploy di server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$HOST" 'bash /opt/edusync/app/deploy/deploy.sh'
