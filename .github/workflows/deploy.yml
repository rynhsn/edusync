name: Deploy
# Produksi hanya berubah saat tag versi (vX.Y.Z) dikirim, dibuat oleh `pnpm release x.y.z`. Cabang main tidak lagi
# men-deploy sendiri. Perlu tiga rahasia di Settings > Secrets and variables > Actions:
# DEPLOY_HOST (IP/alamat server), DEPLOY_USER (mis. ubuntu), DEPLOY_SSH_KEY (kunci privat).
# Deploy ulang atau rollback manual: Actions > Deploy > Run workflow, isi tag yang sudah ada (mis. v1.0.0).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag rilis yang dipasang (mis. v1.0.0)
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Siapkan kunci SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          # Kunci yang disalin dari Windows bisa berawalan BOM dan berakhiran CR; OpenSSH di Linux menolaknya.
          printf '%s\n' "$KEY" | tr -d '\r' | sed '1s/^\xEF\xBB\xBF//' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          # Diagnostik aman: hanya metadata (jumlah/panjang baris, sidik jari), bukan isi kunci.
          if ! ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>/tmp/keyerr; then
            echo "Kunci SSH tidak valid: $(cat /tmp/keyerr)"
            echo "Jumlah baris: $(wc -l < ~/.ssh/id_deploy), ukuran: $(wc -c < ~/.ssh/id_deploy) byte"
            awk '{ printf "baris %d: %d karakter\n", NR, length($0) }' ~/.ssh/id_deploy
            exit 1
          fi
          ssh-keygen -l -f ~/.ssh/id_deploy
      - name: Jalankan deploy di server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$HOST" "REF=$TAG bash /opt/edusync/app/deploy/deploy.sh"
      - name: Cek versi yang berjalan
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        # Port API dibaca dari .env server (bawaan 4100): port 4000 bisa dipakai aplikasi lain di server yang sama.
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$HOST" 'P=$(sudo grep -E "^API_PORT=" /opt/edusync/app/.env | cut -d= -f2); curl -fsS --retry 6 --retry-delay 2 --retry-connrefused "http://127.0.0.1:${P:-4100}/version"'
      - name: Catatan rilis GitHub dari CHANGELOG
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "Edusync $TAG" --notes-file notes.md --verify-tag
