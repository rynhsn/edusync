<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="theme-color" name="theme-color" content="#f4f7f8" />
    <meta name="description" content="EduSync Platform administration" />
    <title>EduSync Platform</title>
    <script>
      // Anti-flash boot script. Runs before the bundle so a dark-mode or non-English operator never
      // sees a light/English first paint. It cannot import the app modules, so the keys and the
      // colour pair are duplicated here — keep them in sync with src/theme/storage.ts and
      // src/i18n/index.ts (both carry a comment pointing back at this block).
      (function () {
        var THEME_KEY = 'edusync-platform.theme';
        var LOCALE_KEY = 'edusync-platform.locale';
        var COLORS = { light: '#f4f7f8', dark: '#0b1418' };
        var LOCALES = ['en', 'id', 'su'];
        var root = document.documentElement;
        try {
          var stored = localStorage.getItem(THEME_KEY);
          var theme = stored === 'dark' || stored === 'light' || stored === 'system' ? stored : 'light';
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) root.classList.add('dark');
          var meta = document.getElementById('theme-color');
          if (meta) meta.setAttribute('content', dark ? COLORS.dark : COLORS.light);

          var storedLocale = localStorage.getItem(LOCALE_KEY);
          var lang = LOCALES.indexOf(storedLocale) >= 0 ? storedLocale : null;
          if (!lang) {
            var candidates = navigator.languages || [navigator.language || ''];
            for (var i = 0; i < candidates.length; i++) {
              var base = String(candidates[i]).toLowerCase().split('-')[0];
              if (LOCALES.indexOf(base) >= 0) { lang = base; break; }
            }
          }
          root.lang = lang || 'en';
        } catch (e) {
          // localStorage can throw (Safari private mode); the defaults above are already applied.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
