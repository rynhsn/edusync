services:
  platform-db:
    image: postgres:17-alpine
    container_name: edusync-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: edusync_platform
      POSTGRES_USER: edusync_platform
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:-dev_platform_password}
    ports:
      - "5433:5432"
    volumes:
      - platform-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusync_platform -d edusync_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  school-db:
    image: postgres:17-alpine
    container_name: edusync-school-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: edusync_school
      POSTGRES_USER: edusync_school
      POSTGRES_PASSWORD: ${SCHOOL_DB_PASSWORD:-dev_school_password}
    ports:
      - "5434:5432"
    volumes:
      - school-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusync_school -d edusync_school"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  platform-db-data:
  school-db-data:
