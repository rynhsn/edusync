name: edusync

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: edusync
      POSTGRES_PASSWORD: edusync_dev_only
      POSTGRES_DB: edusync
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusync -d edusync"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: edusync
      MINIO_ROOT_PASSWORD: edusync_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
